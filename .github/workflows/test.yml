name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    env:
      ETHEREUM_NODE_MAINNET: ${{ secrets.ETHEREUM_NODE_MAINNET }}
      ETHEREUM_NODE_ARBITRUM: ${{ secrets.ETHEREUM_NODE_ARBITRUM }}
      ETHEREUM_NODE_BASE: ${{ secrets.ETHEREUM_NODE_BASE }}
      ETHEREUM_NODE_BNB_SMART_CHAIN: ${{ secrets.ETHEREUM_NODE_BNB_SMART_CHAIN }}
      ETHEREUM_NODE_PLUME: ${{ secrets.ETHEREUM_NODE_PLUME }}
      ETHEREUM_NODE_MEGA_ETH: ${{ secrets.ETHEREUM_NODE_MEGA_ETH }}
      ETHEREUM_NODE_ETHEREUM_SEPOLIA: ${{ secrets.ETHEREUM_NODE_ETHEREUM_SEPOLIA }}
      ETHEREUM_NODE_RAYLS: ${{ secrets.ETHEREUM_NODE_RAYLS }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes --build-info --skip './test/**'
        id: build

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Run Slither
        run: |
          uvx --python 3.13 --from slither-analyzer slither . --ignore-compile

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
